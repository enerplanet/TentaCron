openapi: 3.1.0
info:
  title: TentaCron
  version: "1"
  summary: Orchestration and resolvent API for renewable-energy modelling workflows.
  description: |
    Submit a model payload that still contains resolvent objects; tentacron
    resolves them through the configured resource APIs, forwards the completed
    payload to the target and, for asynchronous targets, polls the target's job
    to completion. Every request is persisted, auditable, and survives a
    restart of the service.

    Authenticate every `/v1` call with the `X-API-Key` header. A key's role
    decides whether it reads only its own requests (`client`) or every request
    (`admin`). The API changes only additively within `/v1`; clients must ignore
    fields they do not know.

    `info.version` is the contract version, the major of the `/v1` prefix; the
    service release is independent of it and reported by `GET /version`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The deployment this document was fetched from (`GET /openapi.yaml`).
  - url: http://localhost:8080
    description: Local development, the default `server.addr`.
security:
  - ApiKeyAuth: []
tags:
  - name: requests
    description: Submit, dry-run and follow orchestration requests.
  - name: schedules
    description: Recurring submissions, materialised into ordinary requests at every due time.
  - name: discovery
    description: What this deployment can do, for frontends.
  - name: system
    description: Health, build and this description. Unauthenticated.

paths:
  /v1/requests:
    post:
      tags: [requests]
      summary: Submit a request
      description: |
        Persists the request and answers `202` at once. Poll `GET /v1/requests/{id}`
        for progress. An `Idempotency-Key` (at most 255 bytes, scoped to the
        client) makes a resubmission of the identical request return the stored
        one instead of creating a duplicate; reusing the key with a different
        target or payload answers `409`. A key at its `max_queued` cap answers
        `429` until one of its requests ends; a replay is never refused.
      operationId: createRequest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            examples:
              demoDirect:
                $ref: "#/components/examples/SubmitDemoDirect"
      responses:
        "202":
          description: Accepted; the request's id and initial state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
              examples:
                accepted:
                  $ref: "#/components/examples/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The Idempotency-Key was already used with a different target or payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: idempotency_conflict, message: Idempotency-Key was already used with a different target or payload }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The target is not configured (`unknown_target`), or the `callback_url` is not https on an allow-listed host (`callback_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownTarget:
                  value:
                    error: { code: unknown_target, message: target "hydra" is not configured }
                callbackNotAllowed:
                  value:
                    error: { code: callback_not_allowed, message: callback_url host "evil.example" is not allow-listed }
        "429":
          description: The key already holds as many queued or running requests as `auth.api_keys[].max_queued` allows (`queue_full`); retry after one of them has ended.
          headers:
            Retry-After:
              description: Seconds until a queued request can have ended — one worker poll interval.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: queue_full, message: this key already holds 200 queued or running requests; retry once one has ended }

    get:
      tags: [requests]
      summary: List requests
      description: |
        Newest first: the caller's own requests, or every client's for an admin
        key. A full page carries `next_cursor`; pass it back as `cursor` with the
        same filters for the next page. No total count is returned.
      operationId: listRequests
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/State"
        - name: target
          in: query
          schema:
            type: string
        - name: client
          in: query
          description: Admin keys only (a client may name itself).
          schema:
            type: string
        - name: since
          in: query
          description: Inclusive lower bound on `created_at`, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Exclusive upper bound on `created_at`, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Page size, default 50, capped at 200.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Opaque.
          schema:
            type: string
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              examples:
                failedPage:
                  $ref: "#/components/examples/JobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/requests/validate:
    post:
      tags: [requests]
      summary: Dry run a request
      description: |
        Decodes, authenticates and inspects the request exactly as the worker
        would start it — which resolvent objects it contains (with their JSON
        pointers and whether their series are cached) and which problems would
        fail the job before the first upstream call — without persisting
        anything or calling any upstream. `200` whenever the request is
        well-formed; `ok` says whether the job could start.
      operationId: validateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            examples:
              demoDirect:
                $ref: "#/components/examples/SubmitDemoDirect"
      responses:
        "200":
          description: The inspection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
              examples:
                couldStart:
                  $ref: "#/components/examples/ValidateOK"
                wouldFail:
                  $ref: "#/components/examples/ValidateProblems"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnknownTarget"

  /v1/requests/batch:
    post:
      tags: [requests]
      summary: Submit several requests at once
      description: |
        Up to 100 submissions in one call, each validated and stored on its
        own: the answer lists one result per item in order — the accepted (or
        replayed) request, or that item's error with the code the single
        endpoint would answer. `202` when at least one item was accepted,
        `400` when none was. An item's `idempotency_key` is scoped to the
        client like the header on the single endpoint, and a key at its
        `max_queued` cap has each further item refused with `queue_full`.
      operationId: createRequests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
            examples:
              mixed:
                $ref: "#/components/examples/BatchMixed"
      responses:
        "202":
          description: At least one item was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
              examples:
                mixed:
                  $ref: "#/components/examples/BatchAccepted"
        "400":
          description: Malformed body, an empty or oversized list, or no item was accepted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/BatchResponse"
              examples:
                malformed:
                  value:
                    error: { code: missing_field, message: requests is required }
                noneAccepted:
                  value:
                    items:
                      - error: { code: unknown_target, message: target "hydra" is not configured }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /v1/schedules:
    post:
      tags: [schedules]
      summary: Create a recurring submission
      description: |
        The same target and payload, submitted at every time the cron
        expression names (five fields, or `@hourly`, `@daily`, `@weekly`,
        `@monthly`, `@yearly`, `@every <duration>`), interpreted in
        `timezone` (an IANA name, default UTC). Runs are ordinary requests
        created with the idempotency key `schedule:<id>:<due time>`, default
        `options.cache: refresh`, and never earlier than their due time. The
        payload is inspected like a dry run, so a schedule whose every run
        would fail is refused. An `Idempotency-Key` (at most 255 bytes,
        scoped to the client) makes a retried creation return the stored
        schedule instead of a second one; reusing the key with a different
        schedule answers `409`.
      operationId: createSchedule
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
            examples:
              daily:
                $ref: "#/components/examples/ScheduleDaily"
      responses:
        "201":
          description: The schedule with its first due time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              examples:
                daily:
                  $ref: "#/components/examples/Schedule"
        "400":
          description: Malformed body or payload, an invalid `cron`, `timezone` or `priority`, or a payload the dry run rejects (`invalid_payload`, `unknown_resolvent`, `target_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidCron:
                  value:
                    error: { code: invalid_parameter, message: "cron \"61 * * * *\": end of range (61) above maximum (59): 61" }
                everyRunWouldFail:
                  value:
                    error: { code: unknown_resolvent, message: no resolvent config for type "resolvent-tidal" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The key already holds as many schedules as `auth.api_keys[].max_schedules` allows (100 by default; `schedule_limit`), or the `Idempotency-Key` was already used with a different schedule (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                scheduleLimit:
                  value:
                    error: { code: schedule_limit, message: this key may hold at most 100 schedules; delete one first }
                idempotencyConflict:
                  value:
                    error: { code: idempotency_conflict, message: Idempotency-Key was already used with a different schedule }
        "422":
          $ref: "#/components/responses/UnknownTarget"
    get:
      tags: [schedules]
      summary: List schedules
      description: The caller's schedules, oldest first, at most 100. An admin key lists every client's, or one client's with `client`.
      operationId: listSchedules
      parameters:
        - name: client
          in: query
          schema: { type: string }
          description: Admin keys only.
      responses:
        "200":
          description: The schedules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
              examples:
                one:
                  $ref: "#/components/examples/Schedules"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [schedules]
      summary: Read a schedule
      operationId: getSchedule
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
              examples:
                daily:
                  $ref: "#/components/examples/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [schedules]
      summary: Delete a schedule
      description: Runs already created stay as ordinary requests.
      operationId: deleteSchedule
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/schedules/{id}/runs:
    get:
      tags: [schedules]
      summary: List a schedule's runs
      description: The requests the schedule created, newest first, with the request list's `state`, `limit` and `cursor` parameters.
      operationId: listScheduleRuns
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/State" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              examples:
                runs:
                  $ref: "#/components/examples/JobList"
        "400":
          description: Invalid `state`, `limit` or `cursor`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/targets:
    get:
      tags: [discovery]
      summary: List configured targets
      description: Names and routing knobs only — never URLs or credentials.
      operationId: listTargets
      responses:
        "200":
          description: The configured targets, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TargetInfo" }
              examples:
                reference:
                  $ref: "#/components/examples/Targets"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/resolvents:
    get:
      tags: [discovery]
      summary: List configured resolvent types
      operationId: listResolvents
      responses:
        "200":
          description: The configured resolvent types, sorted.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResolventInfo" }
              examples:
                reference:
                  $ref: "#/components/examples/Resolvents"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/requests/{id}:
    get:
      tags: [requests]
      summary: Read a request
      description: |
        With `wait`, the call blocks until the request reaches a terminal state
        or the wait elapses (clamped a few seconds below the server's write
        timeout), then answers with the freshest state — one call instead of a
        polling loop.
      operationId: getRequest
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: wait
          in: query
          description: Long-poll duration such as `25s`; omitted or `0` answers at once.
          schema:
            type: string
      responses:
        "200":
          description: The request's state, attempts, result and error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                completed:
                  $ref: "#/components/examples/JobCompleted"
                awaitingTarget:
                  $ref: "#/components/examples/JobAwaitingTarget"
                failed:
                  $ref: "#/components/examples/JobFailed"
                withCallback:
                  $ref: "#/components/examples/JobWithCallback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [requests]
      summary: Cancel a request
      description: |
        A queued request is cancelled at once; one awaiting its target is
        cancelled and the target is asked to stop its job when it offers a
        cancel URL. A request being processed right now answers `409`; retry
        once it is queued again or awaiting the target. Finished requests
        answer `409` too.
      operationId: cancelRequest
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The request, now `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                cancelled:
                  $ref: "#/components/examples/JobCancelled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Being processed right now, or already finished (`not_cancellable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: not_cancellable, message: request is being processed }

  /v1/requests/{id}/result:
    get:
      tags: [requests]
      summary: Download the result
      description: |
        Inline JSON results as `application/json`; file results with their
        recorded content type, `Content-Disposition`, `Accept-Ranges` and
        `Range` support. `404` while the request is not completed, when it
        completed without a body, or after retention pruned the result.
      operationId: getResult
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The stored result. A file result carries the content type the target answered with — `application/zip` for a MEME bundle, `application/octet-stream` when the target named none — so any media type may appear.
          content:
            application/json: {}
            application/zip: {}
            application/octet-stream: {}
            "*/*": {}
        "206":
          description: The requested byte range of a file result, in its recorded content type.
          content:
            application/zip: {}
            application/octet-stream: {}
            "*/*": {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    head:
      tags: [requests]
      summary: Result headers only
      operationId: headResult
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Headers of the stored result, including `Content-Length`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/requests/{id}/events:
    get:
      tags: [requests]
      summary: Read the audit trail
      operationId: getEvents
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Every state transition, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
              examples:
                completed:
                  $ref: "#/components/examples/Events"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /healthz:
    get:
      tags: [system]
      summary: Liveness
      operationId: healthz
      security: []
      responses:
        "200":
          description: The process runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
              example: { status: ok, version: v0.2.0-alpha }
  /readyz:
    get:
      tags: [system]
      summary: Readiness
      operationId: readyz
      security: []
      responses:
        "200":
          description: Migrations ran and the database answers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
              example: { status: ready }
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /version:
    get:
      tags: [system]
      summary: Build information
      operationId: version
      security: []
      responses:
        "200":
          description: The running build.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  go: { type: string }
                  revision: { type: string }
                  built: { type: string }
              example: { version: v0.2.0-alpha, go: go1.26.8, revision: e50bb1b3c2a1, built: "2026-09-06T18:40:00Z" }
  /openapi.yaml:
    get:
      tags: [system]
      summary: This description
      operationId: openapi
      security: []
      responses:
        "200":
          description: The OpenAPI document of the running build.
          content:
            application/yaml: {}

webhooks:
  requestTerminal:
    post:
      operationId: requestTerminal
      summary: Completion callback
      description: |
        Sent once to the request's `callback_url` when the request reaches
        `completed`, `failed` or `cancelled`. The body is exactly the document
        `GET /v1/requests/{id}` answers (without `callback`). Headers:
        `X-Tentacron-Event` (`request.completed` | `request.failed` |
        `request.cancelled`), `X-Tentacron-Request-Id`, `X-Tentacron-Attempt`
        and `X-Tentacron-Signature: sha256=<hex HMAC-SHA256 of the body with
        callbacks.signing_secret>`. Any 2xx acknowledges; a 4xx other than 408
        and 429, or a redirect, ends delivery; anything else is retried with
        the worker backoff up to `callbacks.max_attempts`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Job"
      responses:
        "200":
          description: Acknowledged.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    RequestID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 255
  responses:
    BadRequest:
      description: Malformed body, missing field or invalid parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: missing_field, message: target is required }
    Unauthorized:
      description: Missing or unknown API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unauthorized, message: missing or invalid X-API-Key header }
    NotFound:
      description: No such request — or another client's request, which is indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: not_found, message: no such request }
    PayloadTooLarge:
      description: The body exceeds `server.max_body_bytes`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: payload_too_large, message: request body exceeds the configured limit }
    UnsupportedMediaType:
      description: "`Content-Type: application/json` is required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unsupported_media_type, message: Content-Type must be application/json }
    UnknownTarget:
      description: The target is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unknown_target, message: target "hydra" is not configured }
  schemas:
    State:
      type: string
      enum: [received, resolving, forwarding, awaiting_target, completed, failed, cancelled]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "`invalid_payload`, `unknown_resolvent` and `target_error` are the dry-run problem codes, answered by `POST /v1/schedules` when every run would fail."
              enum: [invalid_json, missing_field, unauthorized, unknown_target, idempotency_conflict,
                     payload_too_large, unsupported_media_type, not_found, method_not_allowed,
                     not_cancellable, callback_not_allowed, invalid_parameter, schedule_limit, queue_full,
                     internal, invalid_payload, unknown_resolvent, target_error]
            message:
              type: string
    CreateRequest:
      type: object
      required: [target, payload]
      properties:
        target:
          type: string
          description: A target name from the configuration.
          example: demo
        payload:
          type: object
          description: The body to resolve and forward. Resolvent objects carry a `type` starting with `resolvent-`.
        priority:
          type: integer
          minimum: -10
          maximum: 10
          default: 0
          description: Higher priorities are claimed first; capped per key.
        options:
          type: object
          description: Per-request processing choices.
          properties:
            cache:
              type: string
              enum: [use, bypass, refresh]
              default: use
              description: "`bypass` neither reads nor writes the series cache; `refresh` fetches fresh and writes."
        not_before:
          type: string
          format: date-time
          description: Delays the run until this time (RFC 3339, at most 30 days ahead). The request is accepted at once and stays `received` until then; it can be cancelled meanwhile.
        callback_url:
          type: string
          format: uri
          description: Receives the job document once the request is terminal (see the `requestTerminal` webhook). Must be https with a host listed in `callbacks.allowed_hosts`; otherwise `422 callback_not_allowed`.
        api_key:
          type: string
          deprecated: true
          description: Fallback for the `X-API-Key` header; the header wins when both are present.
    Accepted:
      type: object
      required: [id, state, links]
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/State" }
        links:
          type: object
          properties:
            self: { type: string }
    Job:
      type: object
      required: [id, target, state, attempts, created_at, updated_at, result, error]
      properties:
        id: { type: string }
        target: { type: string }
        state: { $ref: "#/components/schemas/State" }
        attempts: { type: integer }
        priority:
          type: integer
          description: Present when not the default 0.
        options:
          type: object
          description: Present when any option differs from its default.
          properties:
            cache: { type: string, enum: [bypass, refresh] }
        target_job_id:
          type: string
          description: The asynchronous target's own job id, once accepted.
        not_before:
          type: string
          format: date-time
          description: Present for a delayed run — the earliest time it could be claimed.
        callback:
          type: object
          description: Present when the request named a `callback_url` (on `GET /v1/requests/{id}` only).
          required: [url, state, attempts]
          properties:
            url: { type: string }
            state:
              type: string
              enum: [pending, delivered, failed]
            attempts: { type: integer }
            last_status: { type: integer }
            last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        result:
          oneOf:
            - type: "null"
            - type: object
              properties:
                target_status: { type: integer }
                target_response:
                  description: Inline JSON result (results up to 256 KiB).
                href:
                  type: string
                  description: Download path of a file result.
                content_type: { type: string }
        error:
          oneOf:
            - type: "null"
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [invalid_payload, unknown_target, unknown_resolvent, resource_error,
                         invalid_resource_response, target_error, target_job_failed, target_timeout,
                         max_attempts_exceeded, internal]
                message: { type: string }
    ScheduleRequest:
      type: object
      required: [target, payload, cron]
      properties:
        target: { type: string }
        payload:
          type: object
          description: The body every run resolves and forwards.
        cron:
          type: string
          description: Five fields (`30 6 * * *`) or a descriptor (`@daily`, `@every 6h`).
          example: "30 6 * * *"
        timezone:
          type: string
          default: UTC
          description: IANA zone name the expression is evaluated in.
          example: Europe/Berlin
        priority:
          type: integer
          minimum: -10
          maximum: 10
          default: 0
        options:
          type: object
          properties:
            cache:
              type: string
              enum: [use, bypass, refresh]
              description: Defaults to `refresh` for runs, so every run picks up fresh inputs.
        api_key:
          type: string
          deprecated: true
          description: Fallback for the `X-API-Key` header.
    Schedule:
      type: object
      required: [id, target, cron, timezone, next_run_at, created_at, updated_at, links]
      properties:
        id: { type: string }
        target: { type: string }
        cron: { type: string }
        timezone: { type: string }
        priority:
          type: integer
          description: Present when not the default 0.
        options:
          type: object
          properties:
            cache: { type: string, enum: [bypass, refresh] }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        last_job_id:
          type: string
          description: The request created for the most recent due time.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        links:
          type: object
          properties:
            self: { type: string }
            runs: { type: string }
    BatchRequest:
      type: object
      required: [requests]
      properties:
        api_key:
          type: string
          deprecated: true
          description: Fallback for the `X-API-Key` header.
        requests:
          type: array
          minItems: 1
          maxItems: 100
          items:
            allOf:
              - $ref: "#/components/schemas/CreateRequest"
              - type: object
                properties:
                  idempotency_key:
                    type: string
                    maxLength: 255
    BatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One result per submitted item, in order.
          items:
            type: object
            properties:
              id: { type: string }
              state: { $ref: "#/components/schemas/State" }
              links:
                type: object
                properties:
                  self: { type: string }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
    ValidateResponse:
      type: object
      required: [ok, target, resolvents, problems]
      properties:
        ok:
          type: boolean
          description: Whether the job could start.
        target: { type: string }
        resolvents:
          type: array
          items:
            type: object
            required: [type, path, cached]
            properties:
              type: { type: string }
              path:
                type: string
                description: JSON pointer of the resolvent object in the payload.
              name:
                type: string
                description: The object's `name` field or its registry key.
              cached:
                type: boolean
                description: Whether the series cache already holds this resolvent (always false for a chained one, whose key depends on series not fetched yet).
              depends_on:
                type: array
                items: { type: string }
                description: Names of the resolvents this one references (`$from`), sorted.
        problems:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [invalid_payload, unknown_resolvent, target_error]
              message: { type: string }
    TargetInfo:
      type: object
      required: [name, response_mode, proxy]
      properties:
        name: { type: string }
        response_mode: { type: string, enum: [direct, poll] }
        proxy: { type: boolean }
        timeseries_path: { type: string }
        attach_resolvent: { type: boolean }
    ResolventInfo:
      type: object
      required: [type, backend, cache_ttl]
      properties:
        type: { type: string }
        backend: { type: string, enum: [get, post, target] }
        target:
          type: string
          description: The backing target of a target-backed resolvent.
        cache_ttl: { type: string }
    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor:
          type: string
          description: Present only when more items match.
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [to_state, detail, created_at]
            properties:
              from_state: { $ref: "#/components/schemas/State" }
              to_state: { $ref: "#/components/schemas/State" }
              detail: { type: string }
              created_at:
                type: string
                format: date-time
                description: Millisecond precision.
  examples:
    SubmitDemoDirect:
      summary: A model with two resolvents and one literal series
      description: >
        examples/demo-direct.json as shipped, without the deprecated body key:
        a PV plant and a wind turbine are resolved into hourly series and
        forwarded next to a measured load to the direct-mode `demo` target.
      value:
        target: demo
        payload:
          scenario: rooftop-expansion-2030
          time-series:
            - name: pv_south_roof
              type: resolvent-pv1
              location: { lat: 48.831, lon: 12.957 }
              capacity_kw: 12.5
              azimuth: 180
              tilt: 35
            - name: wind_ridge
              type: resolvent-wind
              location: { lat: 48.902, lon: 12.581 }
              hub_height_m: 120
              rotor_diameter_m: 90
            - name: household_load
              type: time-series
              start: "2030-01-01T00:00:00Z"
              resolution: PT1H
              unit: kW
              values: [0.42, 0.38, 0.35, 0.61]
