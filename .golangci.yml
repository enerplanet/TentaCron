version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - misspell
    - gocritic
    - funlen
  settings:
    funlen:
      # Production functions stay short and single-purpose; table-driven
      # tests are exempt below because their length is data, not logic.
      lines: 50
      statements: 40
      ignore-comments: true
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - funlen
