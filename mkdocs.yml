# Project information
site_name: TentaCron
site_author: enerplanet
site_description: >-
  Orchestration and resolvent API that turns renewable-energy resolvent objects
  into time series and forwards the completed payload to target services.
site_url: https://enerplanet.github.io/tentacron

# Repository
repo_name: enerplanet/tentacron
repo_url: https://github.com/enerplanet/tentacron
edit_uri: edit/main/docs/

# docs/openapi/ holds the OpenAPI description, its standalone Swagger UI
# page and the Go package that embeds the description into the binary; the
# Go sources are not part of the site.
exclude_docs: |
  openapi/*.go

# Theme configuration
theme:
  name: material
  favicon: assets/logos/tentacron-icon-accent.svg # the kit's small-size fallback
  logo: assets/logos/tentacron-mark-paper.svg # single-colour light: the header is dark in both schemes
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.prune
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.sections
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - git-revision-date-localized:
      enable_creation_date: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Service:
      - Architecture: architecture.md
      - API Reference: api.md
      - Configuration: configuration.md
      - Operations: operations.md
  - Decisions:
      - Overview: decisions/README.md
      - ADR-0001 Go single binary: decisions/0001-go-single-binary.md
      - ADR-0002 SQLite store and queue: decisions/0002-sqlite-store-and-queue.md
      - ADR-0003 Async job API: decisions/0003-async-job-api.md
      - ADR-0004 Poll targets to completion: decisions/0004-poll-async-targets-to-completion.md
      - ADR-0005 Per-target timeseries path: decisions/0005-per-target-timeseries-path.md
      - ADR-0006 Postgres decision gate: decisions/0006-postgres-decision-gate.md
      - ADR-0007 OpenAPI contract: decisions/0007-openapi-contract.md
      - ADR-0008 Reverse-proxy boundary: decisions/0008-reverse-proxy-boundary.md
      - Template: decisions/0000-template.md
  - Contributing:
      - Branch Naming: getting-started/branch-naming.md
      - Commit Conventions: getting-started/commit-conventions.md

