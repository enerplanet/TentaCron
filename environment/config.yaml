# TentaCron configuration for the containerized environment.
#
# Same layout as ../config.example.yaml, but the listen port and every
# credential come from the environment (.env.dev / .env.prod via docker
# compose). Interpolation runs over the whole file; referencing an unset
# variable aborts startup.

server:
  addr: ":${PORT}"
  metrics_addr: ":9090" # scraped inside the compose network; not published by default
  log_level: info
  cors:
    allowed_origins: [] # a local frontend against this compose: ["http://localhost:5173"]
    # allow_credentials, max_age, allow_private_network, allowed_headers and
    # expose_headers as in ../config.example.yaml

auth:
  api_keys:
    - name: frontend
      key: "${TENTACRON_KEY_FRONTEND}"
    - name: batch-runner
      key: "${TENTACRON_KEY_BATCH}"

storage:
  path: ./data/tentacron.db # /src/data on the bind mount (gitignored)
  results_dir: ./data/results
  retention: 720h
  max_result_bytes: 1073741824

worker:
  count: 4
  resolvent_concurrency: 4
  poll_interval: 2s
  scheduler_interval: 30s
  max_attempts: 5
  backoff_base: 2s
  backoff_max: 60s
  job_timeout: 15m # must cover a target's timeout plus the longest resolvent timeout

upstream:
  max_response_bytes: 10485760

cache:
  default_ttl: 6h
  cleanup_interval: 15m

targets:
  meme:
    # meme's compose declares no container_name, so the host is the name its
    # own project composes: project meme-env, service api, index 1. The
    # enerplanet Makefile's `meme` target attaches that container to
    # tentacron-net.
    #
    # ?target= is fixed here rather than per request, because a request
    # selects a target by name and never a URL. adopt-net0 is excluded: meme
    # fails a multi-target request as a whole if one framework rejects it,
    # and adopt-net0 supports neither mode "operate" nor multi-port
    # conversion ("flows", how every heat pump, chiller and DHW unit is
    # expressed). Optimise versus simulate is not selected here at all: it
    # travels in the payload as experiment.mode, outside timeseries_path, so
    # tentacron forwards it untouched.
    #
    # attach_resolvent false because meme decodes a timeseries entry with
    # DisallowUnknownFields: the "resolvent" echo tentacron adds for
    # traceability would be an unknown field and the job would 400. Each
    # resolvent feeding this target also needs a response_map emitting only
    # {source, values, unit} — see resolvent-buem.
    #
    # job_timeout covers resolution plus the forward, not the polling that
    # follows (a poll tick is not a processing attempt). A few hundred
    # buildings resolve worker.resolvent_concurrency at a time, so the budget
    # has to cover ceil(N / concurrency) rounds of one buem run each.
    url: "http://meme-env-api-1:8080/simulate?target=pypsa,calliope"
    method: POST
    api_key: "${MEME_API_KEY}"
    api_key_inject: body_field
    api_key_field: api_key
    timeout: 60s
    job_timeout: 45m
    timeseries_path: "model.timeseries"
    attach_resolvent: false
    response:
      mode: poll
      poll:
        id_json_path: "id"
        url_template: "http://meme-env-api-1:8080/jobs/{id}/status"
        status_json_path: "state"
        done_values: [succeeded]
        failed_values: [failed]
        result_url_template: "http://meme-env-api-1:8080/jobs/{id}"
        interval: 10s
        timeout: 30m
        result_timeout: 15m # the bundle download as a whole; the target's timeout bounds each read of it

  buem-building:
    # Singular route; see ../config.example.yaml for the annotated entry.
    # Keyless like buem-buildings: only buem-reverse-proxy (host 8443) reads
    # X-Api-Key, not the app container.
    #
    # Direct mode, so the response is read whole under
    # upstream.max_response_bytes. One building-year of hourly series measures
    # ~666 KB, putting the cap at roughly fifteen building-years; the
    # simulation period and the resolution each multiply it. Over the cap the
    # job fails with target_error naming neither the size nor the period.
    # Extrapolated from one measurement.
    url: "http://buem-gateway:8080/api/v1/buem/building"
    method: POST
    timeout: 300s
    retry_on_timeout: false
    timeseries_path: "."
    attach_resolvent: false
    response:
      mode: direct

  buem-buildings:
    # Plain passthrough proxy for the batch endpoint; see ../config.example.yaml.
    # Keyless: only buem-reverse-proxy (host 8443) reads X-Api-Key, not the
    # app container.
    #
    # Direct mode under upstream.max_response_bytes like its sibling, and the
    # same ~666 KB per building-year: a caller setting keep_timeseries here
    # fails the whole batch past roughly fifteen buildings at one year each.
    # Extrapolated from one measurement.
    url: "http://buem-gateway:8080/api/v1/buem/buildings"
    method: POST
    timeout: 570s # kept under the 10m outbound-client ceiling
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  ignis-calculate:
    # Proxy target; see ../config.example.yaml for the annotated (through-proxy)
    # entry. This environment reaches ignis-http directly on tentacron-net,
    # with no reverse proxy in that path, so no credential is injected.
    url: "http://ignis-http:8080/api/v1/calculate/{code}"
    method: POST
    timeout: 10s # ignis enforces a 5s per-request handler deadline
    proxy: true
    response:
      mode: direct

  ignis-variants-match:
    # GET proxy target: iso2 fills the path, type/year become query parameters.
    url: "http://ignis-http:8080/api/v1/variants/{iso2}/match"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  ignis-data:
    url: "http://ignis-http:8080/api/v1/data/{code}"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  ignis-fields:
    # Empty payload, no path or query, no body: the field-metadata catalogue.
    url: "http://ignis-http:8080/api/v1/fields"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  ignis-variants:
    # iso2 fills the path; the whole country variant list.
    url: "http://ignis-http:8080/api/v1/variants/{iso2}"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  weather-point:
    # GET proxy target; see ../config.example.yaml for the annotated entry.
    # Unlike the ignis targets this environment still injects the key:
    # weather-serve's Flask before_request checks X-API-Key on every route,
    # same-network or not.
    #
    # Reached over the published host port rather than by container name.
    # weather's own compose keeps the service out of any consumer's network
    # namespace and documents host.docker.internal as the cross-project path;
    # environment/docker-compose.yml sets the matching extra_hosts entry.
    # Port must match WEATHER_PORT in repos.conf in the enerplanet umbrella repo.
    url: "http://host.docker.internal:8406/v1/weather/point"
    method: GET
    api_key: "${WEATHER_API_KEY}"
    api_key_inject: header
    api_key_header: X-API-Key
    timeout: 45s
    proxy: true
    response:
      mode: direct

  c2t-trigger-run:
    # POST proxy; see ../config.example.yaml. Keyless here: city2tabula's
    # on-request server enforces no auth. max_attempts 1 + retry_on_timeout
    # false because a run is expensive and not idempotent.
    url: "http://city2tabula:5000/api/v1/runs"
    method: POST
    timeout: 30s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  c2t-run-status:
    url: "http://city2tabula:5000/api/v1/runs/{run_id}"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  c2t-buildings:
    # country + osm_ids to the query; a JSON null body on an empty result.
    url: "http://city2tabula:5000/api/v1/buildings"
    method: GET
    timeout: 30s
    proxy: true
    response:
      mode: direct

  c2t-coverage:
    # How many city2tabula buildings in an extent are linked to a pylovo input
    # building, which is what makes an area modellable. Requires country plus
    # xmin/ymin/xmax/ymax; all five are plain payload fields and reach the
    # query unchanged, so no query_map. The answer is a single count, a few
    # bytes.
    #
    # max_attempts 2, deliberately unlike the sibling c2t entries. A country
    # whose building_link table has not been built answers 500, which is
    # classified as retryable, so the default ladder spends about 30s of
    # backoff before reporting it. That is not an exceptional failure here: an
    # unlinked country is one of the states this target exists to report, so
    # the retries are being spent on an expected answer, behind a synchronous
    # availability check. Two attempts settle in about 6s and still absorb a
    # genuine blip.
    url: "http://city2tabula:5000/api/v1/coverage"
    method: GET
    timeout: 10s
    proxy: true
    max_attempts: 2
    response:
      mode: direct

  c2t-geometry:
    # Footprint geometry for named buildings. Requires country and object_ids,
    # a comma-separated list; both are plain payload fields and reach the
    # query unchanged, so no query_map.
    #
    # Two things a caller has to plan for, both measured against the live
    # service over the 617-building Dutch fixture rather than estimated.
    #
    # The response is large. 617 buildings return about 308 KB, past the
    # 256 KiB an answer may be stored inline, so the result arrives as
    # result.href with no target_response body and the caller must follow the
    # link. A few dozen buildings stay inline. Footprint-only is well under
    # upstream.max_response_bytes either way.
    #
    # include=surfaces is bounded by city2tabula's maxSurfaceBuildings, 1 as
    # of 0.6.0: more ids on that path get a 400, not a large response, so the
    # worst case is one building at a measured 131 KB. Raising that constant
    # puts response size back in play against upstream.max_response_bytes,
    # which fails a job whole rather than truncating it.
    #
    # The request is long. Object ids are 32 characters, so 617 of them make a
    # query string of about 20 KB. City2TABULA answers that in single-digit
    # milliseconds, because Go bounds the request line by MaxHeaderBytes at
    # 1 MB rather than the 8 KB common to nginx and Apache.
    #
    # Measured through the Caddy 2.11 proxy this stack already runs: a request
    # line is accepted up to 64 KiB and the connection is dropped above it, so
    # the ceiling is roughly 1,980 ids and the 617-building case uses about a
    # third of it. nginx or Apache in that position would refuse anything past
    # 8 KB, about 240 ids, with a 414. So the limit follows whichever proxy is
    # in front rather than the payload, and batching is only needed if one of
    # those is introduced.
    #
    # timeout 30s is the sibling value and is not a measurement: the fixture
    # answers in about 8ms. It is headroom, not an expectation.
    #
    # The GeoJSON comes back in the country's storage CRS, not WGS84: the
    # query calls ST_AsGeoJSON without ST_Transform, so Dutch data arrives in
    # EPSG:28992 with coordinates near 198203, 458493. This target proxies it
    # faithfully; reprojection is the caller's problem or City2TABULA's.
    url: "http://city2tabula:5000/api/v1/geometry"
    method: GET
    timeout: 30s
    proxy: true
    response:
      mode: direct

  # pylovo (synthetic low-voltage grids), one proxy target per path and
  # method. Keyless: the pylovo API enforces no auth. See
  # ../config.example.yaml for the annotated entry.
  #
  # pylovo-api-dev is not on this stack's networks yet, so these URLs do not
  # resolve from here until the environment compose file joins spatialhub-net.
  #
  # DELETE /custom-buildings/{building_id} has no entry: config.validMethod
  # accepts GET, POST, PUT and PATCH only.

  pylovo-generate-grid:
    # Phase 1 grid generation. Expensive and not idempotent, so one attempt
    # and no re-submission on a timeout. Models are capped near 300
    # buildings, which keeps the footprint response under
    # upstream.max_response_bytes; an uncapped city polygon would exceed it
    # and fail the job with target_error.
    url: "http://pylovo-api-dev:8086/generate-grid"
    method: POST
    timeout: 300s
    job_timeout: 10m
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  pylovo-estimate-energy:
    url: "http://pylovo-api-dev:8086/estimate-energy"
    method: POST
    timeout: 30s
    proxy: true
    response:
      mode: direct

  pylovo-estimate-energy-batch:
    url: "http://pylovo-api-dev:8086/estimate-energy-batch"
    method: POST
    timeout: 120s
    proxy: true
    response:
      mode: direct

  pylovo-grid-statistics:
    url: "http://pylovo-api-dev:8086/grid-statistics"
    method: POST
    timeout: 60s
    proxy: true
    response:
      mode: direct

  pylovo-power-flow:
    url: "http://pylovo-api-dev:8086/power-flow"
    method: POST
    timeout: 120s
    proxy: true
    response:
      mode: direct

  pylovo-hosting-capacity:
    url: "http://pylovo-api-dev:8086/hosting-capacity"
    method: POST
    timeout: 120s
    proxy: true
    response:
      mode: direct

  pylovo-boundary:
    # POST: the boundary of a caller-supplied polygon.
    url: "http://pylovo-api-dev:8086/boundary"
    method: POST
    timeout: 60s
    proxy: true
    response:
      mode: direct

  pylovo-boundary-get:
    # GET: lat, lon and optional admin_level become query parameters.
    url: "http://pylovo-api-dev:8086/boundary"
    method: GET
    timeout: 30s
    proxy: true
    response:
      mode: direct

  pylovo-boundary-regions:
    url: "http://pylovo-api-dev:8086/boundary/regions"
    method: GET
    timeout: 30s
    proxy: true
    response:
      mode: direct

  pylovo-boundary-states:
    # country_code, version_id, geometry_mode and simplify_m to the query.
    url: "http://pylovo-api-dev:8086/boundary/states"
    method: GET
    timeout: 60s # a state geometry, unsimplified, is large
    proxy: true
    response:
      mode: direct

  pylovo-boundary-available:
    url: "http://pylovo-api-dev:8086/boundary/available"
    method: GET
    timeout: 30s
    proxy: true
    response:
      mode: direct

  pylovo-add-custom-building:
    # Creates a row; one attempt, never re-submitted on a timeout.
    url: "http://pylovo-api-dev:8086/add-custom-building"
    method: POST
    timeout: 30s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  pylovo-custom-buildings-get:
    # user_id fills the path segment and is stripped from the forwarded body.
    url: "http://pylovo-api-dev:8086/custom-buildings/{user_id}"
    method: GET
    timeout: 30s
    proxy: true
    response:
      mode: direct

  pylovo-add-transformer:
    url: "http://pylovo-api-dev:8086/add-transformer"
    method: POST
    timeout: 30s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  pylovo-assign-building:
    url: "http://pylovo-api-dev:8086/assign-building"
    method: POST
    timeout: 30s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  pylovo-delete-transformer:
    url: "http://pylovo-api-dev:8086/delete-transformer"
    method: POST
    timeout: 30s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  pylovo-move-transformer:
    url: "http://pylovo-api-dev:8086/move-transformer"
    method: POST
    timeout: 30s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  pylovo-finalize-transformers:
    url: "http://pylovo-api-dev:8086/finalize-transformers"
    method: POST
    timeout: 60s
    proxy: true
    max_attempts: 1
    retry_on_timeout: false
    response:
      mode: direct

  # Reference data: no parameters, no body.
  pylovo-transformer-sizes:
    url: "http://pylovo-api-dev:8086/transformer-sizes"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  pylovo-consumer-categories:
    url: "http://pylovo-api-dev:8086/consumer-categories"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  pylovo-cable-types:
    url: "http://pylovo-api-dev:8086/cable-types"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  pylovo-equipment-costs:
    url: "http://pylovo-api-dev:8086/equipment-costs"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

  pylovo-voltage-settings:
    url: "http://pylovo-api-dev:8086/voltage-settings"
    method: GET
    timeout: 10s
    proxy: true
    response:
      mode: direct

resolvents:
  # pv1/wind stay out of this deployment: no such service runs in the stack,
  # and a listed entry is one a client may submit and have fail on DNS. The
  # PV backend here is resolvent-pvgis. See ../config.example.yaml for the
  # illustrative POST shape.

  resolvent-pvgis:
    # PVGIS; see ../config.example.yaml for the annotated entry.
    url: "https://re.jrc.ec.europa.eu/api/v5_3/seriescalc?outputformat=json&pvcalculation=1&pvtechchoice=crystSi"
    method: GET
    timeout: 120s
    cache_ttl: 168h # historical years never change
    query_map:
      capacity_kw: peakpower
      tilt: angle
      azimuth: aspect
      from_year: startyear
      to_year: endyear
    response_map:
      type: time-series
      unit: kW
      resolution: PT1H
      index: ".outputs.hourly[*].time" # PVGIS's own stamps, e.g. 20200101:0010
      values: { path: ".outputs.hourly[*].P", scale: 0.001 } # W -> kW
      source: ".inputs.meteo_data.radiation_db"

  resolvent-weather:
    url: "http://host.docker.internal:8406/v1/weather/point?format=json"
    method: GET
    api_key: "${WEATHER_API_KEY}"
    api_key_header: X-API-Key
    timeout: 60s
    cache_ttl: 24h

  resolvent-city2tabula:
    url: "http://city2tabula:5000/api/v1/buildings"
    method: GET
    timeout: 60s
    response_path: "0"
    cache_ttl: 24h

  resolvent-ignis:
    url: "http://ignis-http:8080/api/v1/data/{code}"
    method: GET
    api_key: "${IGNIS_API_KEY}"
    api_key_header: X-Api-Key
    timeout: 30s
    cache_ttl: 168h

  resolvent-buem:
    # See ../config.example.yaml for the annotated entry.
    #
    # response_map is a whitelist: only its own keys reach the substituted
    # object. It is what keeps the slot to a meme TimeSeries, since the
    # extracted BuEM profile carries heating and timestamps, which meme
    # decodes with DisallowUnknownFields and rejects. Paths are relative to
    # response_path, applied first.
    target: buem-building
    payload_field: payload
    response_path: "buem.thermal_load_profile.timeseries"
    response_map:
      source: inline
      values: ".heating"
      unit: ".unit"
    cache_ttl: 24h
