# Tentacron configuration for the containerized environment.
#
# Same layout as ../config.example.yaml, but the listen port and every
# credential come from the environment (.env.dev / .env.prod via docker
# compose). Interpolation runs over the whole file; referencing an unset
# variable aborts startup.

server:
  addr: ":${PORT}"
  metrics_addr: ":9090" # scraped inside the compose network; not published by default
  log_level: info

auth:
  api_keys:
    - name: frontend
      key: "${TENTACRON_KEY_FRONTEND}"
    - name: batch-runner
      key: "${TENTACRON_KEY_BATCH}"

storage:
  path: ./data/tentacron.db # /src/data on the bind mount (gitignored)
  results_dir: ./data/results
  retention: 720h
  max_result_bytes: 1073741824

worker:
  count: 4
  resolvent_concurrency: 4
  poll_interval: 2s
  max_attempts: 5
  backoff_base: 2s
  backoff_max: 60s
  job_timeout: 15m # must cover a target's timeout plus the longest resolvent timeout

upstream:
  max_response_bytes: 10485760

cache:
  default_ttl: 6h
  cleanup_interval: 15m

targets:
  meme:
    url: "https://meme.example.com/simulate?target=all"
    method: POST
    api_key: "${MEME_API_KEY}"
    api_key_inject: body_field
    api_key_field: api_key
    timeout: 60s
    timeseries_path: "model.timeseries"
    response:
      mode: poll
      poll:
        id_json_path: "id"
        url_template: "https://meme.example.com/jobs/{id}/status"
        status_json_path: "state"
        done_values: [succeeded]
        failed_values: [failed]
        result_url_template: "https://meme.example.com/jobs/{id}"
        interval: 10s
        timeout: 30m

  buem:
    # BuEM via buem-gateway; see ../config.example.yaml for the annotated entry.
    url: "https://buem-gateway.example.com/api/v1/buem/buildings"
    method: POST
    api_key: "${BUEM_API_KEY}"
    api_key_inject: header
    api_key_header: X-Api-Key
    timeout: 300s
    job_timeout: 10m
    retry_on_timeout: false # never re-submit a batch simulation cut off by a deadline
    timeseries_path: "."
    attach_resolvent: false
    response:
      mode: direct

  buem-building:
    url: "https://buem-gateway.example.com/api/v1/buem/building"
    method: POST
    api_key: "${BUEM_API_KEY}"
    api_key_inject: header
    api_key_header: X-Api-Key
    timeout: 300s
    retry_on_timeout: false
    timeseries_path: "."
    attach_resolvent: false
    response:
      mode: direct

  ignis-calculate:
    # Proxy target; see ../config.example.yaml for the annotated entry.
    url: "https://ignis.example.com/api/v1/calculate/{code}"
    method: POST
    api_key: "${IGNIS_API_KEY}"
    api_key_inject: header
    api_key_header: X-Api-Key
    timeout: 60s
    proxy: true
    response:
      mode: direct

resolvents:
  # pv1/wind are illustrative POST entries; see ../config.example.yaml.
  resolvent-pv1:
    url: "https://pvsim.example.com/v1/generate"
    method: POST
    api_key: "${PV1_API_KEY}"
    api_key_header: X-API-Key
    timeout: 30s
    cache_ttl: 24h

  resolvent-wind:
    url: "https://windsim.example.com/v1/series"
    method: POST
    api_key: "${WIND_API_KEY}"
    api_key_header: X-API-Key
    timeout: 30s
    cache_ttl: 24h

  resolvent-pvgis:
    # PVGIS; see ../config.example.yaml for the annotated entry.
    url: "https://re.jrc.ec.europa.eu/api/v5_3/seriescalc?outputformat=json&pvcalculation=1&pvtechchoice=crystSi"
    method: GET
    timeout: 120s
    cache_ttl: 168h # historical years never change
    query_map:
      capacity_kw: peakpower
      tilt: angle
      azimuth: aspect
      from_year: startyear
      to_year: endyear
    response_map:
      type: time-series
      unit: kW
      resolution: PT1H
      index: ".outputs.hourly[*].time" # PVGIS's own stamps, e.g. 20200101:0010
      values: { path: ".outputs.hourly[*].P", scale: 0.001 } # W -> kW
      source: ".inputs.meteo_data.radiation_db"

  resolvent-weather:
    url: "https://weather.example.com/v1/weather/point?format=json"
    method: GET
    api_key: "${WEATHER_API_KEY}"
    api_key_header: X-API-Key
    timeout: 60s
    cache_ttl: 24h

  resolvent-city2tabula:
    url: "https://city2tabula.example.com/api/v1/buildings"
    method: GET
    timeout: 60s
    response_path: "0"
    cache_ttl: 24h

  resolvent-ignis:
    url: "https://ignis.example.com/api/v1/data/{code}"
    method: GET
    api_key: "${IGNIS_API_KEY}"
    api_key_header: X-Api-Key
    timeout: 30s
    cache_ttl: 168h

  resolvent-buem:
    # See ../config.example.yaml for the annotated entry.
    target: buem-building
    payload_field: payload
    response_path: "buem.thermal_load_profile.timeseries"
    cache_ttl: 24h
