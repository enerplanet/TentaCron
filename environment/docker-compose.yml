# The tentacron service and its development environment.
#
# Per-environment settings (ports, config, image tag, keys) come from an env file:
#   docker compose --env-file environment/.env.dev -f environment/docker-compose.yml up -d --build api                   # release image, built from this checkout
#   docker compose --env-file environment/.env.dev -f environment/docker-compose.yml up -d --pull always --no-build api  # published release (RELEASE_IMAGE)
#   docker compose --env-file environment/.env.dev -f environment/docker-compose.yml --profile dev up dev               # sources bind-mounted
# or via the Makefile:  make -C environment run ENV=dev   /   ENV=prod

# Pinned, because volume and network names are built from it, and it is the
# unit `down --remove-orphans` acts on.
name: tentacron

services:
  # Development API: the Go toolchain image with the repo root bind-mounted
  # into /src, so edits are picked up without a rebuild.
  dev:
    profiles: [dev]
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: ${IMAGE_TAG:-tentacron-env:latest}
    working_dir: /src
    environment:
      # Unified vars, consumed by the config file's ${...} interpolation and
      # the root Makefile's run target. The client/upstream keys must be
      # non-empty — tentacron refuses to start with missing credentials.
      - PORT=${PORT:-8080}
      - CONFIG=${CONFIG:-environment/config.yaml}
      - TENTACRON_KEY_FRONTEND=${TENTACRON_KEY_FRONTEND:?set in environment/.env.dev|prod}
      - TENTACRON_KEY_BATCH=${TENTACRON_KEY_BATCH:?set in environment/.env.dev|prod}
      - MEME_API_KEY=${MEME_API_KEY:?set in environment/.env.dev|prod}
      - BUEM_API_KEY=${BUEM_API_KEY:?set in environment/.env.dev|prod}
      - PV1_API_KEY=${PV1_API_KEY:?set in environment/.env.dev|prod}
      - WIND_API_KEY=${WIND_API_KEY:?set in environment/.env.dev|prod}
      - WEATHER_API_KEY=${WEATHER_API_KEY:?set in environment/.env.dev|prod}
      - IGNIS_API_KEY=${IGNIS_API_KEY:?set in environment/.env.dev|prod}
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    networks: &networks
      default:
      tentacron-net: # ignis, city2tabula, buem-gateway, weather, meme, pysam-pv
        # Callers in other repositories address `tentacron`. The service name
        # `api` is shared by other repositories on this network and resolves
        # to any of them, so it is never an address.
        aliases: [tentacron]
      spatialhub-net: # pylovo
    command: make run
    restart: unless-stopped

  # Deployment: the distroless release image from the root Dockerfile,
  # read-only config, a named volume for the SQLite store and result files,
  # non-root. RELEASE_IMAGE in the env file selects the published tag.
  api:
    image: ${RELEASE_IMAGE:-ghcr.io/enerplanet/tentacron:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - PORT=${PORT:-8080}
      - TENTACRON_KEY_FRONTEND=${TENTACRON_KEY_FRONTEND:?set in environment/.env.dev|prod}
      - TENTACRON_KEY_BATCH=${TENTACRON_KEY_BATCH:?set in environment/.env.dev|prod}
      - MEME_API_KEY=${MEME_API_KEY:?set in environment/.env.dev|prod}
      - BUEM_API_KEY=${BUEM_API_KEY:?set in environment/.env.dev|prod}
      - PV1_API_KEY=${PV1_API_KEY:?set in environment/.env.dev|prod}
      - WIND_API_KEY=${WIND_API_KEY:?set in environment/.env.dev|prod}
      - WEATHER_API_KEY=${WEATHER_API_KEY:?set in environment/.env.dev|prod}
      - IGNIS_API_KEY=${IGNIS_API_KEY:?set in environment/.env.dev|prod}
    volumes:
      - ./config.yaml:/etc/tentacron/config.yaml:ro
      - tentacron-data:/data
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    networks: *networks
    healthcheck:
      test: ["CMD", "/usr/local/bin/tentacron", "healthcheck", "-addr", "127.0.0.1:${PORT:-8080}"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  # One-shot: validate the config the api service would load, with the same
  # env file — the pre-deploy check.
  validate:
    profiles: [tools]
    image: ${IMAGE_TAG:-tentacron-env:latest}
    build:
      context: ..
      dockerfile: environment/Dockerfile
    working_dir: /src
    environment:
      - PORT=${PORT:-8080}
      - CONFIG=${CONFIG:-environment/config.yaml}
      - TENTACRON_KEY_FRONTEND=${TENTACRON_KEY_FRONTEND:?set in environment/.env.dev|prod}
      - TENTACRON_KEY_BATCH=${TENTACRON_KEY_BATCH:?set in environment/.env.dev|prod}
      - MEME_API_KEY=${MEME_API_KEY:?set in environment/.env.dev|prod}
      - BUEM_API_KEY=${BUEM_API_KEY:?set in environment/.env.dev|prod}
      - PV1_API_KEY=${PV1_API_KEY:?set in environment/.env.dev|prod}
      - WIND_API_KEY=${WIND_API_KEY:?set in environment/.env.dev|prod}
      - WEATHER_API_KEY=${WEATHER_API_KEY:?set in environment/.env.dev|prod}
      - IGNIS_API_KEY=${IGNIS_API_KEY:?set in environment/.env.dev|prod}
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    command: make validate

  # One-shot: compile everything and run the Go test suite.
  test:
    profiles: [tools]
    image: ${IMAGE_TAG:-tentacron-env:latest}
    build:
      context: ..
      dockerfile: environment/Dockerfile
    working_dir: /src
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    command: make test

  # Interactive shell with the Go toolchain and sqlite3 on PATH.
  shell:
    profiles: [tools]
    image: ${IMAGE_TAG:-tentacron-env:latest}
    build:
      context: ..
      dockerfile: environment/Dockerfile
    working_dir: /src
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    command: bash

volumes:
  go-build:
  go-mod:
  tentacron-data:

networks:
  default: {}
  # Shared network for the heat stack. Declared rather than external, so any
  # attached repo can create it. Compose matches the key against the
  # network's own label, so the key must stay spelled as the network name.
  tentacron-net:
    name: tentacron-net
  # Owned by the platform deployment, not by this file. It must already exist
  # or tentacron will not start, so bring the platform up first.
  spatialhub-net:
    external: true
