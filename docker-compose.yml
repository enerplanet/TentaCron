services:
  tentacron:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.example.yaml:/etc/tentacron/config.yaml:ro
      - tentacron-data:/data
    environment:
      # Client keys accepted by tentacron itself
      TENTACRON_KEY_FRONTEND: ${TENTACRON_KEY_FRONTEND:?set in .env}
      TENTACRON_KEY_BATCH: ${TENTACRON_KEY_BATCH:?set in .env}
      # Credentials for downstream services
      MEME_API_KEY: ${MEME_API_KEY:?set in .env}
      BUEM_API_KEY: ${BUEM_API_KEY:?set in .env}
      PV1_API_KEY: ${PV1_API_KEY:?set in .env}
      WIND_API_KEY: ${WIND_API_KEY:?set in .env}
    restart: unless-stopped

volumes:
  tentacron-data:
