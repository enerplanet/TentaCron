# TentaCron configuration reference.
# $${VAR} references are interpolated from the environment at startup;
# referencing an unset variable aborts startup. Use $$$$ for a literal $$.
# (Interpolation runs over the whole file, comments included.)

server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  shutdown_grace: 20s
  max_body_bytes: 10485760 # 10 MiB cap on inbound request bodies
  metrics_addr: "127.0.0.1:9090" # Prometheus /metrics on its own listener; omit to disable
  log_level: info # debug | info | warn | error
  cors:
    allowed_origins: [] # e.g. ["https://app.example.org"]: exact browser origins allowed to call the API

auth:
  # Rotate a key without a gap: set the new value as key, move the old one to
  # previous_key, send SIGHUP; remove previous_key once every client switched.
  api_keys: # named per-client keys, individually revocable
    - name: frontend
      key: "${TENTACRON_KEY_FRONTEND}"
    - name: batch-runner
      key: "${TENTACRON_KEY_BATCH}"
      max_concurrent: 2 # at most two batch jobs in flight; interactive clients keep a worker
      max_priority: 0 # a batch may not jump the queue with a positive priority
      # max_schedules: 100 # schedules this key may hold at once (default 100; 0 forbids)

storage:
  path: ./data/tentacron.db
  results_dir: ./data/results # large/binary target results land here
  retention: 720h # completed/failed jobs pruned after 30 days
  max_result_bytes: 1073741824 # 1 GiB cap on a poll-mode result download (streamed to results_dir)

worker:
  count: 4 # concurrent jobs
  resolvent_concurrency: 4 # per-job fan-out bound to resource APIs
  poll_interval: 2s # queue poll cadence (also picks up scheduled retries)
  scheduler_interval: 30s # how often due schedules become requests
  max_attempts: 5
  backoff_base: 2s
  backoff_max: 60s
  job_timeout: 15m # per processing attempt (resolution + forwarding). Must cover a
  # target's timeout plus the longest resolvent timeout (here buem-building's
  # 300s via resolvent-buem), or a slow forward is cut off and re-submitted;
  # a target can override it with its own job_timeout.

upstream:
  max_response_bytes: 10485760 # 10 MiB cap on JSON responses read into memory (resources, targets, polls)

cache:
  default_ttl: 6h # resolved-series reuse window
  cleanup_interval: 15m

# Completion callbacks: the one place a request may name an outbound URL, so
# the hosts are allow-listed here (https only, exact host or host:port).
# Leave allowed_hosts empty to disable callbacks.
callbacks:
  allowed_hosts: []
  # signing_secret is required once allowed_hosts is set; reference an
  # environment variable with the usual interpolation, never a literal.
  max_attempts: 5
  timeout: 5s

targets:
  meme:
    url: "https://meme.example.com/simulate?target=all"
    method: POST
    api_key: "${MEME_API_KEY}"
    api_key_inject: body_field # meme expects a top-level api_key in the body
    api_key_field: api_key
    timeout: 60s
    timeseries_path: "model.timeseries" # meme spells it without the dash
    response:
      mode: poll # meme /simulate is async: 202 + job id
      poll:
        # Verified against meme's handler code: the accept response carries
        # {"id": ..., "state": "queued", "status_url": "/jobs/{id}/status",
        # "result_url": "/jobs/{id}"}; states are queued|running|succeeded|
        # failed; the result is a zip bundle (409 until finished).
        id_json_path: "id"
        url_template: "https://meme.example.com/jobs/{id}/status"
        status_json_path: "state"
        done_values: [succeeded]
        failed_values: [failed]
        result_url_template: "https://meme.example.com/jobs/{id}"
        # cancel_url_template: "https://meme.example.com/jobs/{id}" # DELETE on client cancellation, once meme offers it
        interval: 10s
        timeout: 30m
        result_timeout: 15m # the bundle download as a whole; the target's timeout bounds each read of it

  buem:
    # BuEM building-energy model via buem-gateway
    # (github.com/enerplanet/buem-gateway): synchronous batch simulation of
    # heating/cooling demand. Replace the host with your gateway deployment.
    url: "https://buem-gateway.example.com/api/v1/buem/buildings"
    method: POST
    api_key: "${BUEM_API_KEY}"
    api_key_inject: header
    api_key_header: X-Api-Key # checked by buem-reverse-proxy
    timeout: 300s # the whole batch simulates in one synchronous call
    job_timeout: 10m # this target's attempt deadline: the batch plus weather resolution
    retry_on_timeout: false # a batch cut off by a deadline may still be simulating;
    # re-submitting it would run the whole simulation twice. Fail with
    # target_timeout instead (5xx and network errors still retry).
    timeseries_path: "." # the weather block sits at the payload root
    attach_resolvent: false # BuEM's schema must receive weather unchanged;
    # traceability stays in tentacron's audit store
    response:
      mode: direct

  buem-building:
    # buem-gateway's single-building endpoint. Callable directly, and the
    # backing target of resolvent-buem below: it returns one JSON object,
    # which is what a resolvent substitution needs (the batch endpoint
    # returns a list).
    url: "https://buem-gateway.example.com/api/v1/buem/building"
    method: POST
    api_key: "${BUEM_API_KEY}"
    api_key_inject: header
    api_key_header: X-Api-Key
    timeout: 300s
    retry_on_timeout: false
    timeseries_path: "."
    attach_resolvent: false
    response:
      mode: direct

  ignis-calculate:
    # Proxy target: tentacron contributes auth, persistence, audit and
    # retries but hands the payload through unresolved — no resolvent
    # scanning. The {code} placeholder is filled from the payload's
    # top-level "code" field, which is then stripped from the forwarded
    # body (ignis's overrides schema has no code field); the remaining
    # payload is the optional TABULA overrides object.
    url: "https://ignis.example.com/api/v1/calculate/{code}"
    method: POST
    api_key: "${IGNIS_API_KEY}"
    api_key_inject: header
    api_key_header: X-Api-Key
    timeout: 60s
    proxy: true
    response:
      mode: direct

  demo:
    # Minimal direct-mode target illustrating the default "time-series"
    # array container; the generic example requests point here.
    url: "https://demo-target.example.com/v1/run"
    method: POST
    timeout: 30s
    timeseries_path: "time-series"
    response:
      mode: direct

resolvents:
  # resolvent-pv1 and resolvent-wind are ILLUSTRATIVE entries showing the
  # classic POST contract (whole resolvent object as JSON body, JSON series
  # back) — the shape of an in-house profile service. For real PV production
  # use resolvent-pvgis below; the other entries are verified integrations.
  resolvent-pv1:
    url: "https://pvsim.example.com/v1/generate"
    method: POST
    api_key: "${PV1_API_KEY}"
    api_key_header: X-API-Key
    timeout: 30s
    cache_ttl: 24h

  resolvent-wind:
    url: "https://windsim.example.com/v1/series"
    method: POST
    api_key: "${WIND_API_KEY}"
    api_key_header: X-API-Key
    timeout: 30s
    cache_ttl: 24h

  resolvent-pvgis:
    # PVGIS (JRC) hourly PV production — the real PV backend, verified against
    # the public API: no key, ~800 KB per year. The resolvent's fields are
    # renamed onto PVGIS parameters (query_map) and the hourly rows are
    # reshaped into a time-series object (response_map), power in kW. Fields
    # not in query_map (lat, lon, loss) pass through under their own name.
    # PVGIS aspect: 0 = south, -90 = east, 90 = west.
    url: "https://re.jrc.ec.europa.eu/api/v5_3/seriescalc?outputformat=json&pvcalculation=1&pvtechchoice=crystSi"
    method: GET
    timeout: 120s
    cache_ttl: 168h # historical years never change
    query_map:
      capacity_kw: peakpower
      tilt: angle
      azimuth: aspect
      from_year: startyear
      to_year: endyear
    response_map:
      type: time-series
      unit: kW
      resolution: PT1H
      index: ".outputs.hourly[*].time" # PVGIS's own stamps, e.g. 20200101:0010
      values: { path: ".outputs.hourly[*].P", scale: 0.001 } # W -> kW
      source: ".inputs.meteo_data.radiation_db"

  resolvent-weather:
    # enerplanet/weather's point-query API. A GET resolvent: the object's
    # fields become query parameters (provider, lat, lon, year, and use_case
    # or variables: [T, GHI]); format=json is fixed here so the response is
    # the {index, variables} block buem-gateway requires.
    url: "https://weather.example.com/v1/weather/point?format=json"
    method: GET
    api_key: "${WEATHER_API_KEY}"
    api_key_header: X-API-Key
    timeout: 60s
    cache_ttl: 24h

  resolvent-city2tabula:
    # THD-Spatial-AI/city2tabula: geometric building attributes and the
    # TABULA variant classification from 3D city models. GET with the
    # resolvent's fields as query parameters (country plus osm_ids or an
    # xmin/ymin/xmax/ymax bbox); the API returns a list, so response_path
    # "0" selects the matched building. No API key per its spec.
    url: "https://city2tabula.example.com/api/v1/buildings"
    method: GET
    timeout: 60s
    response_path: "0"
    cache_ttl: 24h

  resolvent-ignis:
    # THD-Spatial-AI/ignis: the raw TABULA parameter set for a variant code
    # (e.g. city2tabula's tabula_variant_code). The {code} placeholder in the
    # URL is filled from the resolvent object's "code" field. Its /match
    # endpoint (variants/{country_iso2}/match?type=…&period=…) is equally
    # configurable as another GET resolvent if you classify from type/period.
    url: "https://ignis.example.com/api/v1/data/{code}"
    method: GET
    api_key: "${IGNIS_API_KEY}"
    api_key_header: X-Api-Key # checked by ignis's reverse proxy
    timeout: 30s
    cache_ttl: 168h # TABULA typology data is effectively static

  resolvent-buem:
    # Target composition: a BuEM simulation feeding another target's payload
    # (e.g. the heat-demand series of a MEME model). The resolvent object's
    # "payload" field is forwarded through the buem-building target — never
    # scanned for resolvent objects; other resolvents' results reach it only
    # through explicit references (docs: "Resolution order"), filled before
    # the call — and the load-profile timeseries is extracted from the
    # response. The backing
    # target's url/auth/timeout apply; identical simulations are served from
    # the series cache.
    target: buem-building
    payload_field: payload
    response_path: "buem.thermal_load_profile.timeseries"
    cache_ttl: 24h
