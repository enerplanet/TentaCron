name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a floating "latest" can start failing on rule changes
          # unrelated to the code under review. Bump deliberately.
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/tentacron
      - name: Validate the reference configs
        env:
          PORT: "8080"
          TENTACRON_KEY_FRONTEND: ci
          TENTACRON_KEY_BATCH: ci
          MEME_API_KEY: ci
          BUEM_API_KEY: ci
          PV1_API_KEY: ci
          WIND_API_KEY: ci
          WEATHER_API_KEY: ci
          IGNIS_API_KEY: ci
        run: |
          ./tentacron validate -config config.example.yaml
          ./tentacron validate -config environment/config.yaml

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz smoke (10s per target)
        run: make fuzz FUZZTIME=10s

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator
      - name: Validate the OpenAPI description
        run: openapi-spec-validator docs/openapi/openapi.yaml

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
