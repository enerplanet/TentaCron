# Keeps the Go module graph, the GitHub Actions pins and the container base
# image current. Commit prefixes match the repository's conventional-commit
# linter (build / ci), so Dependabot PRs pass the commit check unchanged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories: ["/", "/environment"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
